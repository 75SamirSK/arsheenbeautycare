<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arsheen Beauty Care — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <style>
    :root{--ivory:#FBF5EF;--ivory2:#F3E9DE;--rose:#8C4A5C;--ink:#3A2A2E;--soft:#6E5A5E;--white:#fff;--gold:#C7A25C}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,var(--ivory),#f7ede8);font-family:Jost,Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}
    .card{width:min(430px,100%);background:rgba(255,255,255,.96);border:1px solid var(--ivory2);border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(140,74,92,.14)}
    .brand{font-family:Georgia,serif;color:var(--rose);font-size:25px;text-align:center;margin-bottom:4px}.subtitle{text-align:center;color:var(--soft);font-size:13px;margin-bottom:28px}
    h1{font-family:Georgia,serif;color:var(--rose);font-size:27px;margin:0 0 8px}.note{color:var(--soft);font-size:13px;line-height:1.55;margin:0 0 20px}
    label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin:0 0 7px}.field{margin-bottom:16px}
    input{width:100%;padding:13px 14px;border:1px solid var(--ivory2);border-radius:11px;background:#fff;font:inherit;color:var(--ink);outline:none}input:focus{border-color:var(--rose)}
    button{width:100%;padding:13px 16px;border:0;border-radius:11px;background:var(--rose);color:#fff;font:600 14px inherit;cursor:pointer}.secondary{background:transparent;color:var(--rose);border:1px solid var(--rose);margin-top:10px}
    .status{text-align:center;min-height:20px;margin-top:14px;font-size:13px;color:var(--soft)}.links{text-align:center;margin-top:18px;font-size:12px}.links a{color:var(--rose)}
    .success{display:none;text-align:center}.success h2{font-family:Georgia,serif;color:var(--rose);font-size:24px}.success p{color:var(--soft);font-size:13px;line-height:1.55}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Arsheen Beauty Care</div>
    <div class="subtitle">Owner Administration</div>
    <section id="loginView">
      <h1>Admin Login</h1>
      <p class="note">Sign in to manage your products, categories, orders and shop settings.</p>
      <div class="field"><label for="email">Email</label><input id="email" type="email" value="arsheenbeautycare@gmail.com" readonly></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="Enter your Firebase password" autocomplete="current-password"></div>
      <button id="signIn">Sign in to Dashboard</button>
      <button id="forgot" class="secondary" type="button">Forgot password?</button>
      <div id="status" class="status"></div>
      <div class="links"><a href="../">Back to store</a></div>
    </section>
    <section id="successView" class="success">
      <h2>Signed in</h2><p>Opening your Owner Dashboard…</p>
    </section>
  </main>
<script>
const firebaseConfig={apiKey:'AIzaSyCZfDc2ACBbnqy1Gm0BvGOBhqPNE6mawF0',authDomain:'arsheen-1dc9c.firebaseapp.com',projectId:'arsheen-1dc9c'};
const ADMIN_EMAIL='arsheenbeautycare@gmail.com';
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const statusEl=document.getElementById('status');
function msg(t){statusEl.textContent=t}
function friendlyAuthError(e){
  const code=e&&e.code?String(e.code):'';
  const map={
    'auth/too-many-requests':'Too many requests. Please wait and try again later.',
    'auth/user-not-found':'This admin email is not registered in Firebase Authentication.',
    'auth/invalid-email':'The admin email address is invalid.',
    'auth/unauthorized-continue-uri':'Password reset is blocked because this website address is not authorized in Firebase.',
    'auth/operation-not-allowed':'Email/password authentication is not enabled in Firebase.',
    'auth/invalid-api-key':'Firebase configuration is invalid.',
    'auth/network-request-failed':'Network error. Check your internet connection and try again.',
    'auth/internal-error':'Firebase returned an internal error. Please try again.'
  };
  return map[code]||('Firebase error: '+(code||'unknown-error'));
}
async function login(){
  const password=document.getElementById('password').value;
  if(!password){msg('Enter your password.');return}
  msg('Signing in…');
  try{
    const cred=await auth.signInWithEmailAndPassword(ADMIN_EMAIL,password);
    const user=cred.user;
    if(!user||user.email.toLowerCase()!==ADMIN_EMAIL){await auth.signOut();msg('This account is not authorized.');return}
    document.getElementById('loginView').style.display='none';document.getElementById('successView').style.display='block';
    location.href='../?admin=1';
  }catch(e){
    console.error(e);
    msg(friendlyAuthError(e));
  }
}
document.getElementById('signIn').addEventListener('click',login);
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
document.getElementById('forgot').addEventListener('click',async()=>{
  msg('Sending reset email…');
  try{
    await auth.sendPasswordResetEmail(ADMIN_EMAIL);
    msg('Reset email sent. Check Inbox, Spam, and Promotions.');
  }catch(e){
    console.error(e);
    msg(friendlyAuthError(e));
  }
});
</script>
</body>
</html>
