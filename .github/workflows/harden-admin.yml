name: Harden admin authentication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch static app
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          text = p.read_text(encoding="utf-8")

          # Remove the default plaintext passcode from the shipped JavaScript.
          text = text.replace('    passcode: "swing",\n', '')

          marker = "<!-- SECURITY HARDENING: Firebase Authentication + admin gate -->"
          if marker not in text:
              hardening = r'''<!-- SECURITY HARDENING: Firebase Authentication + admin gate -->
<script>
(function(){
  const ADMIN_EMAIL = 'REPLACE_WITH_YOUR_ADMIN_EMAIL';
  const authUnavailableMessage = 'Admin login is temporarily unavailable.';

  function ensureLoginFields(){
    const sheet = document.getElementById('adminLoginSheet');
    if(!sheet) return;
    const field = document.getElementById('adminPass');
    if(field){
      field.type = 'password';
      field.autocomplete = 'current-password';
      field.placeholder = 'Password';
    }
    const label = sheet.querySelector('label[for="adminPass"]');
    if(label) label.textContent = 'Admin Password';
    let email = document.getElementById('adminEmail');
    if(!email && field){
      const wrap = field.closest('.field');
      email = document.createElement('input');
      email.id = 'adminEmail';
      email.type = 'email';
      email.autocomplete = 'username';
      email.placeholder = 'Admin email';
      email.className = field.className;
      const emailField = document.createElement('div');
      emailField.className = 'field';
      const emailLabel = document.createElement('label');
      emailLabel.setAttribute('for','adminEmail');
      emailLabel.textContent = 'Admin Email';
      emailField.appendChild(emailLabel);
      emailField.appendChild(email);
      wrap.parentNode.insertBefore(emailField, wrap);
    }
    const note = sheet.querySelector('.empty-note');
    if(note) note.textContent = 'Secure admin sign-in. Your password is verified by Firebase Authentication and is never stored in this page.';
    const hint = sheet.querySelector('.hint');
    if(hint) hint.textContent = 'Use the admin email and password created in Firebase Authentication.';
  }

  async function adminIsAuthenticated(){
    if(!window.firebase || !firebase.auth) return false;
    const user = firebase.auth().currentUser;
    return !!user && !!user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  }

  window.showAdminLogin = function(){
    ensureLoginFields();
    if(window.firebase && firebase.auth){
      const user = firebase.auth().currentUser;
      if(user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){
        window.openAdminDashboard();
        return;
      }
    }
    if(typeof openSheet === 'function') openSheet('adminLoginSheet');
    const e = document.getElementById('adminEmail');
    const p = document.getElementById('adminPass');
    if(e) e.value = e.value || '';
    if(p) p.value = '';
  };

  window.tryAdminLogin = async function(){
    ensureLoginFields();
    if(!window.firebase || !firebase.auth){ showToast(authUnavailableMessage); return; }
    const email = (document.getElementById('adminEmail')?.value || '').trim();
    const password = document.getElementById('adminPass')?.value || '';
    if(!email || !password){ showToast('Enter admin email and password'); return; }
    if(email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
      showToast('Invalid admin credentials');
      return;
    }
    try{
      await firebase.auth().signInWithEmailAndPassword(email, password);
      closeSheet('adminLoginSheet');
      window.openAdminDashboard();
      showToast('Admin signed in');
    }catch(err){
      console.error('Firebase admin login failed:', err);
      showToast('Invalid admin credentials');
    }
  };

  window.openAdminDashboard = async function(){
    if(!(await adminIsAuthenticated())){
      showToast('Please sign in as the admin');
      if(typeof showAdminLogin === 'function') showAdminLogin();
      return;
    }
    const el = document.getElementById('adminDashboard');
    if(el) el.classList.add('open');
    document.body.style.overflow = 'hidden';
    if(typeof renderAdminProductList === 'function') renderAdminProductList();
    if(typeof renderOverviewStats === 'function') renderOverviewStats();
    if(typeof fillSettingsForm === 'function') fillSettingsForm();
    if(typeof renderCategoryList === 'function') renderCategoryList();
    if(typeof startOrdersListener === 'function') startOrdersListener();
  };

  window.closeAdminDashboard = function(){
    const el = document.getElementById('adminDashboard');
    if(el) el.classList.remove('open');
    document.body.style.overflow = '';
    if(window.firebase && firebase.auth) firebase.auth().signOut().catch(console.error);
  };

  window.savePasscode = function(){
    showToast('Password changes must be made in Firebase Authentication.');
  };

  window.addEventListener('load', function(){
    ensureLoginFields();
    if(window.firebase && firebase.auth){
      firebase.auth().onAuthStateChanged(function(user){
        if(user && user.email && user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
          firebase.auth().signOut().catch(console.error);
        }
      });
    }
  });
})();
</script>
'''
              text = text.replace('</body>', hardening + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')

      - name: Add Firestore rules template
        run: |
          cat > firestore.rules <<'EOF'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              function isAdmin() {
                return request.auth != null
                  && request.auth.token.email == 'REPLACE_WITH_YOUR_ADMIN_EMAIL';
              }

              // Public storefront data may be read by customers, but only the
              // authenticated admin may change it.
              match /store/{docId} {
                allow read: if true;
                allow write: if isAdmin();
              }

              match /products/{docId} {
                allow read: if true;
                allow write: if isAdmin();
              }

              // Customers may submit orders. Only the admin may change an
              // existing order. Customer tracking should ideally be moved to
              // a callable backend/API for strict per-order authorization.
              match /orders/{orderId} {
                allow create: if true;
                allow read: if isAdmin();
                allow update, delete: if isAdmin();
              }
            }
          }
          EOF

      - name: Add security setup notes
        run: |
          cat > SECURITY_SETUP.md <<'EOF'
          # Admin security setup

          The old dashboard used a client-side passcode (`swing`) and `localStorage`,
          which is not real authentication. The app now expects Firebase Authentication
          (Email/Password) and a matching admin email in the Firestore rules.

          1. In Firebase Console for project `arsheen-1dc9c`, enable **Authentication → Sign-in method → Email/Password**.
          2. Create the shop-owner user with the admin email you will use.
          3. In `index.html`, replace `REPLACE_WITH_YOUR_ADMIN_EMAIL` in the security-hardening block with that exact email.
          4. In `firestore.rules`, replace the same placeholder with the exact admin email.
          5. Deploy the rules from a trusted machine with Firebase CLI: `firebase deploy --only firestore:rules`.
          6. Delete any old copies of the passcode from browser storage (`arsheen_settings`) on devices that previously used the dashboard.

          The Firebase web `apiKey` in the page is not itself an admin secret; the important protection is Firebase Authentication plus Firestore rules.
          EOF

      - name: Commit hardened version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html firestore.rules SECURITY_SETUP.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "security: replace client passcode with Firebase auth"
            git push
          fi
