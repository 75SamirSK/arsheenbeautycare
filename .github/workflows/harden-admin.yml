name: Harden admin authentication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch static app
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('    passcode: "swing",\n', '')
          marker = '<!-- SECURITY HARDENING: Firebase Authentication + admin gate -->'
          if marker in text:
              block = '''<!-- SECURITY HARDENING: Firebase Authentication + admin gate -->
<script>
(function(){
  const ADMIN_EMAIL = 'arsheenbeautycare@gmail.com';

  function ensureLoginFields(){
    const sheet = document.getElementById('adminLoginSheet');
    if(!sheet) return;
    const pass = document.getElementById('adminPass');
    if(pass){
      pass.type = 'password';
      pass.autocomplete = 'current-password';
      pass.placeholder = 'Password';
    }
    const label = sheet.querySelector('label[for="adminPass"]');
    if(label) label.textContent = 'Admin Password';
    let email = document.getElementById('adminEmail');
    if(!email && pass){
      const wrap = pass.closest('.field');
      const ef = document.createElement('div');
      ef.className = 'field';
      const el = document.createElement('label');
      el.setAttribute('for','adminEmail');
      el.textContent = 'Admin Email';
      email = document.createElement('input');
      email.id = 'adminEmail';
      email.type = 'email';
      email.autocomplete = 'username';
      email.placeholder = ADMIN_EMAIL;
      ef.appendChild(el); ef.appendChild(email);
      wrap.parentNode.insertBefore(ef, wrap);
    }
    const note = sheet.querySelector('.empty-note');
    if(note) note.textContent = 'Secure admin sign-in. Password verification is handled by Firebase Authentication.';
    const hint = sheet.querySelector('.hint');
    if(hint) hint.textContent = 'Use the shop owner Firebase email and password.';
  }

  function isAdmin(){
    if(!window.firebase || !firebase.auth) return false;
    const user = firebase.auth().currentUser;
    return !!user && (user.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
  }

  window.showAdminLogin = function(){
    ensureLoginFields();
    if(isAdmin()) return window.openAdminDashboard();
    if(typeof openSheet === 'function') openSheet('adminLoginSheet');
    const e = document.getElementById('adminEmail');
    const p = document.getElementById('adminPass');
    if(e) e.value = ADMIN_EMAIL;
    if(p) p.value = '';
  };

  window.tryAdminLogin = async function(){
    ensureLoginFields();
    const password = document.getElementById('adminPass')?.value || '';
    if(!password){ showToast('Enter admin password'); return; }
    try{
      await firebase.auth().signInWithEmailAndPassword(ADMIN_EMAIL, password);
      if(!isAdmin()) throw new Error('Not admin');
      closeSheet('adminLoginSheet');
      await window.openAdminDashboard();
      showToast('Admin signed in');
    }catch(err){
      console.error('Firebase admin login failed:', err);
      showToast('Invalid admin password');
    }
  };

  window.openAdminDashboard = async function(){
    if(!isAdmin()){ showToast('Please sign in as admin'); return; }
    const el = document.getElementById('adminDashboard');
    if(el) el.classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.closeAdminDashboard = function(){
    const el = document.getElementById('adminDashboard');
    if(el) el.classList.remove('open');
    document.body.style.overflow = '';
    if(window.firebase && firebase.auth) firebase.auth().signOut().catch(console.error);
  };

  window.savePasscode = function(){
    showToast('Admin password is managed in Firebase Authentication.');
  };

  window.addEventListener('load', function(){
    ensureLoginFields();
    if(window.firebase && firebase.auth){
      firebase.auth().onAuthStateChanged(function(user){
        if(user && (user.email || '').toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
          firebase.auth().signOut().catch(console.error);
        }
      });
    }
  });
})();
</script>'''
              text = re.sub(r'<!-- SECURITY HARDENING: Firebase Authentication \+ admin gate -->.*?</script>', block, text, count=1, flags=re.S)
          p.write_text(text, encoding='utf-8')

      - name: Write Firestore rules
        run: |
          cat > firestore.rules <<'EOF'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              function isAdmin() {
                return request.auth != null
                  && request.auth.token.email == 'arsheenbeautycare@gmail.com';
              }

              match /store/{docId} {
                allow read: if true;
                allow write: if isAdmin();
              }

              match /products/{docId} {
                allow read: if true;
                allow write: if isAdmin();
              }

              match /orders/{orderId} {
                allow create: if true;
                allow read, update, delete: if isAdmin();
              }
            }
          }
          EOF

      - name: Write security notes
        run: |
          cat > SECURITY_SETUP.md <<'EOF'
          # Admin security setup

          Admin access uses Firebase Authentication for `arsheenbeautycare@gmail.com`.
          The old client-only passcode is removed from the shipped app.

          In Firebase Console for project `arsheen-1dc9c`:
          1. Enable Authentication -> Sign-in method -> Email/Password.
          2. Create `arsheenbeautycare@gmail.com` as the owner account.
          3. Set a strong password there. Do not store the password in GitHub.
          4. Deploy `firestore.rules`: `firebase deploy --only firestore:rules`.
          5. Clear site data on devices that previously used the old dashboard.
          EOF

      - name: Commit hardened version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html firestore.rules SECURITY_SETUP.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'security: harden admin authentication'
            git push
          fi
