name: Harden admin authentication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin login
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          marker = '<!-- ARSHEEN FIREBASE ADMIN LOGIN PATCH -->'
          if marker not in text:
              script = r'''<!-- ARSHEEN FIREBASE ADMIN LOGIN PATCH -->
<script>
(function(){
  const ADMIN_EMAIL = 'arsheenbeautycare@gmail.com';

  function setupAdminLoginUI(){
    const pass = document.getElementById('adminPass');
    if(!pass) return;
    pass.type = 'password';
    pass.autocomplete = 'current-password';
    pass.placeholder = 'Enter admin password';
    const sheet = document.getElementById('adminLoginSheet');
    if(sheet){
      const title = sheet.querySelector('h2, h3, .sheet-title');
      if(title && /owner login/i.test(title.textContent)) title.textContent = 'Admin Login';
      const labels = sheet.querySelectorAll('label');
      labels.forEach(label => {
        if(/owner passcode/i.test(label.textContent)) label.textContent = 'Admin Password';
      });
      sheet.querySelectorAll('.empty-note, .hint, p').forEach(el => {
        if(/on-device passcode|static html|not a real security|forgot the passcode/i.test(el.textContent)){
          el.textContent = 'Sign in with the Firebase admin account. Password verification is handled by Firebase Authentication.';
        }
      });
    }
  }

  function isAdminUser(){
    try{
      const user = window.firebase && firebase.auth ? firebase.auth().currentUser : null;
      return !!user && (user.email || '').toLowerCase() === ADMIN_EMAIL;
    }catch(e){ return false; }
  }

  window.openAdminLogin = function(){
    setupAdminLoginUI();
    if(isAdminUser()) return window.openAdminDashboard();
    openSheet('adminLoginSheet');
    const pass = document.getElementById('adminPass');
    if(pass) pass.value = '';
  };

  window.tryAdminLogin = async function(){
    setupAdminLoginUI();
    const pass = document.getElementById('adminPass');
    const password = pass ? pass.value : '';
    if(!password){ showToast('Enter admin password'); return; }
    try{
      if(!window.firebase || !firebase.auth){
        showToast('Firebase Authentication is not ready yet. Please refresh and try again.');
        return;
      }
      await firebase.auth().signInWithEmailAndPassword(ADMIN_EMAIL, password);
      const user = firebase.auth().currentUser;
      if(!user || (user.email || '').toLowerCase() !== ADMIN_EMAIL){
        await firebase.auth().signOut();
        showToast('Admin account not authorized');
        return;
      }
      closeSheet('adminLoginSheet');
      window.openAdminDashboard();
      showToast('Admin signed in');
    }catch(err){
      console.error('Firebase admin login failed:', err);
      showToast('Wrong email or password');
    }
  };

  const originalOpenDashboard = window.openAdminDashboard;
  window.openAdminDashboard = function(){
    if(!isAdminUser()){
      showToast('Please sign in with the admin account');
      return;
    }
    const el = document.getElementById('adminDashboard');
    if(el) el.classList.add('open');
    document.body.style.overflow = 'hidden';
    try { switchAdminTab('overview'); } catch(e) {}
    try { fillSettingsForm(); } catch(e) {}
    try { renderProductCategoryChips(); } catch(e) {}
    try { renderAdminProductList(); } catch(e) {}
    try { renderCategoryList(); } catch(e) {}
    try { startLiveOrdersListener(); } catch(e) {}
    try { renderOverviewStats(); } catch(e) {}
  };

  window.addEventListener('load', function(){
    setupAdminLoginUI();
    if(window.firebase && firebase.auth){
      firebase.auth().onAuthStateChanged(function(user){
        if(user && (user.email || '').toLowerCase() !== ADMIN_EMAIL){
          firebase.auth().signOut().catch(function(){});
        }
      });
    }
  });
})();
</script>
'''
              text = text.replace('</body>', script + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/harden-admin.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'security: replace legacy owner passcode with Firebase auth'
            git push
          fi
