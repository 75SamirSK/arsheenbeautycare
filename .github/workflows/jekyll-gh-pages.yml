name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add dedicated Firebase admin portal bridge
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- DEDICATED FIREBASE ADMIN PORTAL V1 -->'

          if marker not in text:
              patch = r'''<!-- DEDICATED FIREBASE ADMIN PORTAL V1 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){
  const ADMIN_EMAIL = 'arsheenbeautycare@gmail.com';
  const ADMIN_PATH = './admin/';

  // The old hidden/logo-based login is retired. Any existing owner-login trigger
  // now takes the owner directly to the dedicated admin portal.
  window.openAdminLogin = function(){
    window.location.href = ADMIN_PATH;
  };
  window.tryAdminLogin = function(){
    window.location.href = ADMIN_PATH;
  };
  window.savePasscode = function(){
    if (typeof showToast === 'function') showToast('Use the Admin portal to change or reset your password.');
  };

  function openDashboardAfterAuth(){
    const params = new URLSearchParams(window.location.search);
    if (params.get('admin') !== '1') return;

    if (!window.firebase || typeof firebase.auth !== 'function') {
      window.location.href = ADMIN_PATH;
      return;
    }

    firebase.auth().onAuthStateChanged(function(user){
      if (!user || (user.email || '').toLowerCase() !== ADMIN_EMAIL) {
        window.location.href = ADMIN_PATH;
        return;
      }
      setTimeout(function(){
        try {
          if (typeof openAdminDashboard === 'function') openAdminDashboard();
        } catch (e) {
          console.error('Could not open admin dashboard:', e);
        }
      }, 200);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', openDashboardAfterAuth, {once:true});
  } else {
    openDashboardAfterAuth();
  }
})();
</script>
'''
              text = text.replace('</body>', patch + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
