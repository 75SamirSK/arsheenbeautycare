name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin login in deployed site
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- FIREBASE ADMIN DEPLOY OVERRIDE V2 -->'

          if marker not in text:
              patch = r'''<!-- FIREBASE ADMIN DEPLOY OVERRIDE V2 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){
  const ADMIN_EMAIL = 'arsheenbeautycare@gmail.com';

  function buildLogin(){
    const sheet = document.getElementById('adminLoginSheet');
    if(!sheet) return;
    const inner = sheet.querySelector('.sheet');
    if(!inner) return;
    inner.innerHTML = `
      <div class="sheet-head">
        <h2>Owner Login</h2>
        <button class="close-x" onclick="closeSheet('adminLoginSheet')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <p class="empty-note" style="text-align:left;">Sign in with the authorized Firebase admin account to open the Owner Dashboard.</p>
      <div class="field">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" value="${ADMIN_EMAIL}" autocomplete="username" readonly>
      </div>
      <div class="field">
        <label for="adminPass">Admin Password</label>
        <input type="password" id="adminPass" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button class="primary-btn" onclick="tryAdminLogin()">Sign In</button>
      <p class="hint" style="margin-top:14px;">Your password is checked by Firebase Authentication.</p>
    `;

    const pass = document.getElementById('adminPass');
    if(pass){
      pass.addEventListener('keydown',function(e){
        if(e.key==='Enter') window.tryAdminLogin();
      });
    }
  }

  window.openAdminLogin = function(){
    buildLogin();
    if(typeof openSheet==='function') openSheet('adminLoginSheet');
    const pass=document.getElementById('adminPass');
    if(pass){
      pass.value='';
      setTimeout(function(){pass.focus();},50);
    }
  };

  window.tryAdminLogin = async function(){
    const email=(document.getElementById('adminEmail')?.value || ADMIN_EMAIL).trim().toLowerCase();
    const password=document.getElementById('adminPass')?.value || '';

    if(email!==ADMIN_EMAIL){showToast('Use the authorized admin email');return;}
    if(!password){showToast('Enter admin password');return;}

    try{
      if(!window.firebase || typeof firebase.auth!=='function'){
        showToast('Firebase Authentication is not ready. Refresh the page.');
        return;
      }

      const credential=await firebase.auth().signInWithEmailAndPassword(ADMIN_EMAIL,password);
      const user=credential.user || firebase.auth().currentUser;

      if(!user || (user.email||'').toLowerCase()!==ADMIN_EMAIL){
        await firebase.auth().signOut();
        showToast('Admin account not authorized');
        return;
      }

      if(typeof closeSheet==='function') closeSheet('adminLoginSheet');
      if(typeof openAdminDashboard==='function') openAdminDashboard();
      showToast('Admin signed in');
    }catch(err){
      console.error('Firebase admin login failed:',err);
      const code=err && err.code ? String(err.code) : '';
      if(code==='auth/too-many-requests') showToast('Too many attempts. Try again later.');
      else if(code==='auth/user-disabled') showToast('This admin account is disabled');
      else showToast('Wrong email or password');
    }
  };

  window.savePasscode=function(){
    showToast('Admin password is managed by Firebase Authentication.');
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',buildLogin,{once:true});
  }else{
    buildLogin();
  }
})();
</script>
'''
              text = text.replace('</body>', patch + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
